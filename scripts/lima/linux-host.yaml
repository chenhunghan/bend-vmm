# A Linux (arm64) host for bend-vmm's KVM backend: Ubuntu 24.04 with
# /dev/kvm, clang and Bend. On an M3 or later Mac, Virtualization.framework
# nests KVM natively (vmType: vz, nestedVirtualization: true); before M3,
# scripts/lima/linux-host.sh runs this with vmType: qemu through
# scripts/lima/qemu-el2 (emulated EL2). linux-host.sh mounts the repository
# read-only and works on a copy in the guest's home.
vmType: qemu
cpus: 4
memory: 6GiB
disk: 30GiB
images:
- location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img
  arch: aarch64
containerd:
  system: false
  user: false
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    dpkg -s libx11-dev >/dev/null 2>&1 || { apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y clang lld zlib1g-dev libx11-dev make git curl python3 zstd binutils rsync; }
    chmod 666 /dev/kvm || true
- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    command -v bend >/dev/null || [ -x ~/.bend/bin/bend ] || curl -fsSL https://bend-lang.com/install.sh | sh
