name: check

on:
  push:
    branches: [main, 'ci/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BEND_VERSION: 2.0.39
      BEND_SHA_LINUX_X64: 6cf462fd8f70b094a4950ebb709a9c4ffd8f1d1189d9cedf1fd63cd5d041c7ab
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Gate
        run: scripts/check.sh
      - name: Laws are append-only
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          # Every line of every existing law file must survive, and no
          # laws/done marker may go: removals or edits fail the build.
          removed=$(git diff "origin/$GITHUB_BASE_REF"...HEAD -- laws | grep '^-[^-]' || true)
          if [ -n "$removed" ]; then echo "laws/ lines removed or changed:"; echo "$removed"; exit 1; fi
          frozen=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD -- tests | while read -r f; do git show "origin/$GITHUB_BASE_REF:$f" 2>/dev/null | grep -l 'FROZEN SPEC' >/dev/null && echo "$f"; done)
          if [ -n "$frozen" ]; then echo "frozen tests changed: $frozen"; exit 1; fi

  verdict:
    # Every done module re-checked by the BendTT kernel, proven sound in Lean.
    runs-on: ubuntu-latest
    env:
      BEND_VERSION: 2.0.39
      BEND_SHA_LINUX_X64: 6cf462fd8f70b094a4950ebb709a9c4ffd8f1d1189d9cedf1fd63cd5d041c7ab
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_X64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-lean-4.34.0
      - name: Install Lean 4.34
        run: |
          [ -x "$HOME/.elan/bin/lean" ] || curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.0 --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verdict
        run: VERDICT=1 scripts/check.sh

  host-linux:
    # The host layer (KVM backend) builds on Linux arm64 and boots guests on
    # KVM. Hosted runners have no /dev/kvm, so scripts/ci/emulated-kvm.sh
    # runs the guest check on a QEMU-emulated arm64 CPU with EL2 (slow).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      BEND_VERSION: 2.0.39
      BEND_SHA_LINUX_ARM64: 71b43e1bb9313dd14ac2b0553b854e41c39d65ecaa47040796ebff4a46f54a97
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Bend and the toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld libx11-dev zstd qemu-system-arm qemu-utils
          name="bend-$BEND_VERSION-linux-arm64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/$name" "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA_LINUX_ARM64  /tmp/$name" | sha256sum -c -
          tar -xzf "/tmp/$name" -C /tmp
          mkdir -p "$HOME/.bend/bin"
          mv /tmp/bend/bend2 /tmp/bend/guide "$HOME/.bend/"
          mv /tmp/bend/bin/bend "$HOME/.bend/bin/bend"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      - name: Guests on KVM (emulated EL2)
        run: scripts/ci/emulated-kvm.sh

  host-macos:
    # Guests on Hypervisor.framework. GitHub's macOS runners cannot nest, so
    # this needs a self-hosted Apple Silicon runner (labels self-hosted,
    # macOS, ARM64) with Bend 2.0.39, Xcode Command Line Tools and qemu-img;
    # it runs when the repository variable MACOS_RUNNER is "true". Pushes to
    # main only: a self-hosted runner must not run pull requests' code.
    if: vars.MACOS_RUNNER == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Guests on Hypervisor.framework
        run: SKIP_NATIVE=1 scripts/check-host.sh
